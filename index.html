<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite LMS Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: 'var(--theme-primary)', bgMain: 'var(--theme-bg)', panelMain: 'var(--theme-panel)' } } } }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="styles.css" />
    
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden text-slate-100">

    <style id="dynamic-theme"></style>

    <div id="notice-bar" class="bg-primary text-slate-900 font-bold text-sm py-1.5 marquee hidden z-50">
        <span id="notice-text"></span>
    </div>

    <header id="main-nav" class="glass-panel sticky top-0 z-40 border-b border-white/10 shadow-lg">
        <div class="container mx-auto px-4 py-2 flex justify-between items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight cursor-pointer flex items-center gap-2 text-primary transition-colors" onclick="window.location.hash=''">
                <svg class="w-6 h-6 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9z"/></svg>
                <span class="hidden sm:inline">EduZod</span>
            </h1>
            <nav class="hidden md:block text-xs font-medium text-slate-400 flex-grow px-4 overflow-hidden whitespace-nowrap text-ellipsis" id="breadcrumb"></nav>
            <div class="flex items-center gap-2 md:gap-3 shrink-0">
                <div class="text-xs text-slate-300 hidden lg:block" id="user-greeting"></div>
                <div id="auth-buttons" class="flex items-center gap-2"></div>
            </div>
        </div>
        <div class="md:hidden container mx-auto px-4 pb-2"><nav class="text-[10px] font-medium text-slate-400 overflow-x-auto whitespace-nowrap pb-1" id="breadcrumb-mobile"></nav></div>
    </header>

    <main class="container mx-auto px-4 md:px-6 py-6 flex-grow" id="app-container"></main>

    <div id="modal-root"></div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        (function() {
            // 1. CONFIGURATION (Set these once and leave them forever)
            const GITHUB_USER = "tamzid-amin-0909"; 
            const GITHUB_REPO = "Elite";
            const JS_VERSION  = "1.11"; // Change this ONLY when you want to force an update on live site
            
            // 2. AUTO-ENVIRONMENT DETECTION
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            
            // This determines where your PHP calls go
            const apiBaseUrl = isLocal ? window.location.origin + window.location.pathname : window.location.origin + '/';
            // This determines where your JS files load from
            const jsBaseUrl  = isLocal ? '' : `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@main/`;

            // 3. THE AUTOMATIC FETCH HIJACKER (Keeps your API requests pointing to the correct server)
            const nativeFetch = window.fetch;
            window.fetch = async function(input, init) {
                let url = typeof input === 'string' ? input : input.url;
                if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('//')) {
                    const cleanBase = apiBaseUrl.endsWith('/') ? apiBaseUrl : apiBaseUrl + '/';
                    const cleanUrl = url.startsWith('/') ? url.slice(1) : url;
                    url = `${cleanBase}${cleanUrl}`;
                }
                return typeof input === 'string' ? nativeFetch(url, init) : nativeFetch(new Request(url, input), init);
            };

            // 4. CHRONOLOGICAL LIST OF YOUR 13 APP LOGIC FILES
            const appScripts = [
                "backend-state.js", "utilities.js", "rememberme.js", "securityguard.js", 
                "auth.js", "forcelogout.js", "skeletonloader.js", "header.js", 
                "bannerslider.js", "contentviews.js", "hardenedplayer.js", 
                "adminactions.js", "adminpanel.js", "initapp.js", "app.js", "restrict.js"
            ];

            // 5. INJECT SCRIPTS DYNAMICALLY
            appScripts.forEach(scriptName => {
                const script = document.createElement('script');
                const versionTag = isLocal ? '' : `?v=${JS_VERSION}`;
                script.src = `${jsBaseUrl}${scriptName}${versionTag}`;
                script.async = false; // Prevents loading order bugs
                document.body.appendChild(script);
            });
        })();
    </script>

</body>
</html>
